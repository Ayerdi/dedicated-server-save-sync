services:
  volume-init:
    build: .
    user: "0"
    command:
      - sh
      - -eu
      - -c
      - >-
        mkdir -p /data/save-sync/backups /data/save-sync/temporary &&
        chown -R 10001:10001 /data/save-sync &&
        chmod 0700 /data/save-sync /data/save-sync/backups /data/save-sync/temporary
    volumes:
      - type: volume
        source: save_sync_local_data
        target: /data/save-sync
        volume:
          nocopy: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    restart: "no"

  dedicated-server-save-sync:
    depends_on:
      volume-init:
        condition: service_completed_successfully
    env_file:
      - path: ${SAVE_SYNC_LOCAL_ENV_FILE:-.env.local}
        required: true
    ports:
      - 127.0.0.1:${SAVE_SYNC_LOCAL_PORT:-18080}:8080
    volumes:
      - type: volume
        source: save_sync_local_data
        target: /data/save-sync
        volume:
          nocopy: true
      - ./config/games/${SAVE_SYNC_GAME_KEY:-palworld}.json:/app/game.json:ro

  backup-supervisor:
    depends_on:
      volume-init:
        condition: service_completed_successfully
    env_file:
      - path: ${SAVE_SYNC_LOCAL_ENV_FILE:-.env.local}
        required: true
    volumes:
      - type: volume
        source: save_sync_local_data
        target: /data/save-sync
        volume:
          nocopy: true
      - ./scripts/backup-supervisor-e2e-hook.py:/app/backup-supervisor-e2e-hook.py:ro

networks:
  traefik_proxy:
    name: ${SAVE_SYNC_LOCAL_NETWORK:-save-sync-local}
    external: false

volumes:
  save_sync_local_data:
    name: ${SAVE_SYNC_LOCAL_VOLUME:-save-sync-local-data}