name: Reproducible bug
description: Report a defect without attaching private deployment data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tokens, saves, ZIP archives, `.env` files, real paths, domains or personal information.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend/API
        - PowerShell client
        - Palworld adapter
        - Docker/Traefik
        - Backup supervisor
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, saves, domains, private paths and personal data.
          required: true
