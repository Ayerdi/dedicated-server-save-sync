name: Error reproducible
description: Informa de un fallo sin adjuntar datos privados.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: No incluyas tokens, saves, ZIP, `.env`, rutas o dominios reales.
  - type: input
    id: version
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options:
        - Backend/API
        - Cliente PowerShell
        - Adaptador Palworld
        - Docker/Traefik
        - Documentación
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos mínimos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado obtenido
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He eliminado credenciales, saves, dominios, rutas y datos personales.
          required: true
