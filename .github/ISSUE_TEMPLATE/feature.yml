name: Maintenance enhancement
description: Propose a bounded improvement to the maintained Palworld / experimental Valheim implementation.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        v2.2.2 remains the stable Palworld release; main also contains an experimental Valheim adapter.
        Do not use this form for a broad multi-game redesign, universal discovery, multiple server
        instances, device/cloud sync or a new cross-platform agent.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the current limitation or risk.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Bounded proposal
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Impact on versions, locking, identity and recovery
    validations:
      required: true
