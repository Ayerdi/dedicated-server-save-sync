name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Verificar locks reproducibles
        run: |
          pip-compile --generate-hashes --strip-extras --output-file=requirements.txt requirements.in
          pip-compile --allow-unsafe --generate-hashes --strip-extras --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - run: ruff check save_sync tests wsgi.py
      - run: python scripts/check-docs.py
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt --progress-spinner=off
      - run: docker compose config --quiet
      - run: docker build -t dedicated-server-save-sync:test .
      - run: bash scripts/check-repository.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.9.0 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Ejecutar Pester
        shell: powershell
        run: Import-Module Pester -RequiredVersion 5.9.0; Invoke-Pester -Path .\client -CI

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/local-e2e.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar y ejecutar Gitleaks sin artefactos
        run: bash scripts/run-gitleaks.sh
