name: Publish v2.2.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v2.2.2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.2 >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Repository and documentation checks
        if: steps.existing.outputs.exists == 'false'
        run: |
          bash scripts/check-repository.sh
          python3 scripts/check-docs.py
          python3 scripts/check-language.py

      - name: Build deterministic client twice
        if: steps.existing.outputs.exists == 'false'
        run: |
          bash scripts/build-release.sh 2.2.2
          first="$(cut -d' ' -f1 dist/dedicated-server-save-sync-client-v2.2.2.zip.sha256)"
          first_copy="$(mktemp /tmp/save-sync-v2.2.2.XXXXXX.zip)"
          trap 'rm -f -- "${first_copy}"' EXIT
          cp dist/dedicated-server-save-sync-client-v2.2.2.zip "${first_copy}"
          rm -f dist/dedicated-server-save-sync-client-v2.2.2.zip*
          bash scripts/build-release.sh 2.2.2
          second="$(cut -d' ' -f1 dist/dedicated-server-save-sync-client-v2.2.2.zip.sha256)"
          test "$first" = "$second"
          cmp "${first_copy}" dist/dedicated-server-save-sync-client-v2.2.2.zip

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.2 \
            dist/dedicated-server-save-sync-client-v2.2.2.zip \
            dist/dedicated-server-save-sync-client-v2.2.2.zip.sha256 \
            --target "${GITHUB_SHA}" \
            --title 'v2.2.2 — English-first Palworld reference' \
            --notes-file docs/RELEASE-NOTES-v2.2.2.md
