name: Publish v2.2.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v2.2.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.0 >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Repository safety check
        if: steps.existing.outputs.exists == 'false'
        run: bash scripts/check-repository.sh

      - name: Build deterministic client twice
        if: steps.existing.outputs.exists == 'false'
        run: |
          bash scripts/build-release.sh 2.2.0
          first="$(cut -d' ' -f1 dist/dedicated-server-save-sync-client-v2.2.0.zip.sha256)"
          cp dist/dedicated-server-save-sync-client-v2.2.0.zip /tmp/client-first.zip
          rm -f dist/dedicated-server-save-sync-client-v2.2.0.zip*
          bash scripts/build-release.sh 2.2.0
          second="$(cut -d' ' -f1 dist/dedicated-server-save-sync-client-v2.2.0.zip.sha256)"
          test "$first" = "$second"
          cmp /tmp/client-first.zip dist/dedicated-server-save-sync-client-v2.2.0.zip

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.0 \
            dist/dedicated-server-save-sync-client-v2.2.0.zip \
            dist/dedicated-server-save-sync-client-v2.2.0.zip.sha256 \
            --target "${GITHUB_SHA}" \
            --title 'v2.2.0 — Stable Palworld reference release' \
            --notes-file docs/RELEASE-NOTES-v2.2.0.md
